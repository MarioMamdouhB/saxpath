name: SaxPath CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test API
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/api/requirements.txt
          python -m pytest services/api

      - name: Test audio engine
        run: |
          python -m pip install -r services/audio-engine/requirements.txt
          python -m pytest services/audio-engine
