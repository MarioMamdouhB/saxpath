name: saxpath_mobile
description: Arabic-first beginner saxophone learning app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.5.1
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  path_provider: ^2.1.5
  record: ^6.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
