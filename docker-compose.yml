services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saxpath}
      POSTGRES_USER: ${POSTGRES_USER:-saxpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saxpath}
    ports:
      - "5432:5432"

  api:
    build:
      context: ./services/api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saxpath}
      POSTGRES_USER: ${POSTGRES_USER:-saxpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saxpath}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    depends_on:
      - postgres
    ports:
      - "8000:8000"
